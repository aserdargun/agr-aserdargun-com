    <noscript>
      <main>
        <h1>Agora</h1>
        <p>
          A deliberation panel of OpenRouter’s free models. You put a proposition to the panel; every seat answers it
          alone first, then reads the other seats and answers again. Agora counts that second round and shows who
          dissented. Interface available in English and Turkish.
        </p>
        <p>
          <strong>Scope:</strong> the free roster changes week to week, and these are small models. A verdict is the
          panel’s leaning at one moment, not a verified correct answer. No panel member writes the verdict, so nobody
          judges their own vote.
        </p>
        <h2>What it does</h2>
        <ul>
          <li>Reads the live free-model catalogue and seats the models that can hold a position, showing why any are left off.</li>
          <li>Keeps model names out of the prompts, so a seat cannot defer to a brand it can recognise.</li>
          <li>Separates measured confidence from a model’s self-reported number, and marks prose answers as non-compliant.</li>
          <li>Stays inside the 50 free requests per day instead of buying a higher quota, and shows what each session costs.</li>
        </ul>
      </main>
    </noscript>
